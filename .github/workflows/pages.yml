name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/main']
  workflow_dispatch:

# Let the deployment mint an id-token and write to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the test suite
        run: npm test

      - name: Configure Pages
        # enablement turns Pages on the first time this runs, so the site does
        # not need switching on by hand in the repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        # There is no build step: copy across what the page actually loads.
        run: |
          mkdir -p _site
          cp index.html favicon.svg manifest.webmanifest _site/
          cp -r src styles _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
