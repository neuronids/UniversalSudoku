name: Publish the site

on:
  push:
    branches: ['claude/main']
  workflow_dispatch:

# The site is served from the gh-pages branch, so publishing means writing
# to that branch; GitHub builds and deploys it from there on its own.
permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the test suite
        run: npm test

      - name: Assemble the site
        # There is no build step: copy across what the page actually loads.
        run: |
          mkdir -p _site
          cp index.html favicon.svg manifest.webmanifest _site/
          cp -r src styles _site/
          touch _site/.nojekyll

      - name: Push it to gh-pages
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
